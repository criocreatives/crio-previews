<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crio Previews</title>
  <meta name="description" content="Interactive project presentations, concepts and client previews by Crio Creatives.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b0b0c; }
    body {
      min-height: 100vh;
      padding: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(760px, 100%);
      border-top: 5px solid #ED1C24;
      padding-top: 32px;
    }
    .brand {
      margin: 0 0 38px;
      color: #fff;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1.5px;
    }
    .brand span { font-weight: 400; }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(42px, 8vw, 82px);
      line-height: .92;
      letter-spacing: -.055em;
    }
    .red { color: #ED1C24; }
    p {
      max-width: 600px;
      margin: 0;
      color: #aaa;
      font-size: 17px;
      line-height: 1.6;
    }
    .tag {
      margin-top: 42px;
      color: #777;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      body { padding: 24px; }
      .brand { margin-bottom: 32px; font-size: 27px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Crio <span>Creatives</span></div>
    <h1>PROJECT<br><span class="red">PREVIEWS.</span></h1>
    <p>Interactive project presentations, concepts and client previews by Crio Creatives.</p>
    <div class="tag">criocreatives.com</div>
  </main>
</body>
</html>
