<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Crio Previews</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icons/Crio%20Creatives%20favicon.png">
  <style>
    :root{
      --red:#ED1C24;
      --bg:#080808;
      --panel:#111214;
      --line:#2a2b2f;
      --text:#f4f4f4;
      --muted:#9d9da2;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 82% 18%, rgba(237,28,36,.16), transparent 28%),
        linear-gradient(180deg,#090909,#060606);
      color:var(--text);
      font-family:Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
    }
    a{color:inherit;text-decoration:none}
    header{
      width:100%;
      border-bottom:1px solid rgba(255,255,255,.07);
      background:rgba(8,8,8,.8);
      backdrop-filter:blur(16px);
    }
    .nav{
      width:min(1180px,calc(100% - 40px));
      height:76px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }
    .brand img{height:28px;width:auto;display:block}
    .main-link{
      font-size:11px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#bdbdc1;
    }
    .main-link:hover{color:#fff}
    main{
      flex:1;
      width:min(1180px,calc(100% - 40px));
      margin:auto;
      display:grid;
      place-items:center;
      padding:72px 0 90px;
    }
    .content{
      width:100%;
      display:grid;
      grid-template-columns:.9fr 1.1fr;
      gap:72px;
      align-items:center;
    }
    .code{
      font-size:clamp(118px,21vw,300px);
      line-height:.72;
      font-weight:900;
      letter-spacing:-.08em;
      color:var(--red);
      user-select:none;
    }
    .eyebrow{
      color:var(--red);
      font-size:12px;
      font-weight:900;
      letter-spacing:.17em;
      text-transform:uppercase;
      margin-bottom:18px;
    }
    h1{
      margin:0;
      max-width:680px;
      font-size:clamp(42px,6vw,78px);
      line-height:.94;
      letter-spacing:-.055em;
    }
    p{
      max-width:620px;
      margin:24px 0 0;
      color:var(--muted);
      font-size:17px;
      line-height:1.65;
    }
    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:30px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 20px;
      border-radius:999px;
      border:1px solid var(--line);
      font-size:13px;
      font-weight:800;
    }
    .btn.primary{
      background:var(--red);
      border-color:var(--red);
      color:#fff;
    }
    .btn.secondary{
      background:#111214;
      color:#fff;
    }
    .btn:hover{transform:translateY(-1px)}
    footer{
      width:min(1180px,calc(100% - 40px));
      margin:auto;
      padding:0 0 34px;
      color:#66676b;
      font-size:11px;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    @media(max-width:800px){
      .content{grid-template-columns:1fr;gap:42px}
      .code{font-size:clamp(120px,35vw,220px)}
      main{padding-top:46px}
    }
    @media(max-width:520px){
      .nav,main,footer{width:calc(100% - 28px)}
      .nav{height:66px}
      .brand img{height:24px}
      .main-link{display:none}
      p{font-size:15px}
      .actions{flex-direction:column}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="brand" href="/"><img src="/assets/logos/Crio%20Creatives%20white%20-%20Copy.png" alt="Crio Creatives"></a>
      <a class="main-link" href="https://criocreatives.com" target="_blank" rel="noopener">Main Website ↗</a>
    </div>
  </header>

  <main>
    <div class="content">
      <div class="code">404</div>
      <div>
        <div class="eyebrow">Crio Previews</div>
        <h1>This preview isn't here.</h1>
        <p>The link may have moved, been retired, or never existed at this address. Head back to the preview hub or continue to the main Crio Creatives website.</p>
        <div class="actions">
          <a class="btn primary" href="/">Back to Previews</a>
          <a class="btn secondary" href="https://criocreatives.com" target="_blank" rel="noopener">Visit Crio Creatives ↗</a>
        </div>
      </div>
    </div>
  </main>

  <footer>Crio Creatives · Preview Environment</footer>
</body>
</html>
