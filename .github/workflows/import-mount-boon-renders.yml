name: Import Mount Boon replacement renders

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-mount-boon-renders.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compressed render set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mountboon-renders
          mkdir -p /tmp/mountboon-renders lot-18-mount-boon/renders
          curl -L --fail --retry 3 -o /tmp/mountboon-renders/Renders_compressed.zip 'https://at.adobe.com/7sO2pqLN110beF2j'
          unzip -q /tmp/mountboon-renders/Renders_compressed.zip -d lot-18-mount-boon/renders
          find lot-18-mount-boon/renders -type f -maxdepth 1 -print | sort -V

      - name: Commit renders and remove importer
        shell: bash
        run: |
          rm -f .github/workflows/import-mount-boon-renders.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lot-18-mount-boon/renders .github/workflows/import-mount-boon-renders.yml
          git commit -m 'Add compressed Mount Boon replacement renders'
          git pull --rebase origin main
          git push
