name: Import additional graphic design assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-more-graphic-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download compressed artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p graphic-design/assets
          curl -L --fail --retry 3 -o graphic-design/assets/return-to-care.jpg 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:9fd76588-6114-4564-88da-9649a0216cca'
          curl -L --fail --retry 3 -o graphic-design/assets/jads-hiv-discrimination.jpg 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:bd0efe06-7a64-472c-b1da-43d31867dc4f'
          curl -L --fail --retry 3 -o graphic-design/assets/suncoast-billboard.jpg 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:afd50561-6151-4c99-acf2-0108e947291c'
          curl -L --fail --retry 3 -o graphic-design/assets/suncoast-property-flyer.jpg 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:652812cb-de25-4585-9bed-f9024cba3571'
      - name: Commit assets and remove one-time importer
        shell: bash
        run: |
          rm -f .github/workflows/import-more-graphic-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graphic-design/assets .github/workflows/import-more-graphic-assets.yml
          git commit -m 'Add compressed graphic design portfolio assets'
          git push
