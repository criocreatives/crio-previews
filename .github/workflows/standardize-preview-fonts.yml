name: Standardize preview typography

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standardize-preview-fonts.yml'

permissions:
  contents: write

jobs:
  update-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Helvetica across preview pages
        shell: python
        run: |
          from pathlib import Path
          import re

          files = list(Path('.').rglob('*.html')) + list(Path('.').rglob('*.css'))
          changed = []

          for path in files:
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              updated = re.sub(
                  r'font-family\s*:\s*[^;}]+',
                  'font-family:Helvetica,Arial,sans-serif',
                  text,
                  flags=re.IGNORECASE
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:')
          for path in changed:
              print(path)

      - name: Commit typography changes and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/standardize-preview-fonts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Use Helvetica across preview pages'
          git pull --rebase origin main
          git push
