name: Add portfolio favicons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-portfolio-favicons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Crio favicon to portfolio pages
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path("portfolio/index.html"),
              Path("face-billboard/index.html"),
              Path("koolya/index.html"),
              Path("graphic-design/index.html"),
          ]
          favicon = '<link rel="icon" href="/assets/icons/Crio%20Creatives%20favicon.png">'

          for path in files:
              text = path.read_text(encoding="utf-8")
              if 'rel="icon"' in text or "rel='icon'" in text:
                  continue

              viewport_candidates = [
                  '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
                  '<meta name="viewport" content="width=device-width,initial-scale=1">',
                  '<meta name="viewport" content="width=device-width, initial-scale=1">',
              ]

              inserted = False
              for marker in viewport_candidates:
                  if marker in text:
                      text = text.replace(marker, marker + "\n  " + favicon, 1)
                      inserted = True
                      break

              if not inserted:
                  if "<head>" in text:
                      text = text.replace("<head>", "<head>\n  " + favicon, 1)
                  else:
                      raise RuntimeError(f"Could not find <head> in {path}")

              path.write_text(text, encoding="utf-8")

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-portfolio-favicons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portfolio/index.html face-billboard/index.html koolya/index.html graphic-design/index.html .github/workflows/add-portfolio-favicons.yml
          git commit -m 'Add Crio favicon across portfolio pages'
          git push
