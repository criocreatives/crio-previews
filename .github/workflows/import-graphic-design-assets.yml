name: Import graphic design portfolio assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-graphic-design-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download compressed portfolio artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p graphic-design/assets
          curl -L --fail --retry 3 -o graphic-design/assets/mavado-big-money.jpg 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:e8086288-49a2-4c08-8304-30c226c4260f'
          curl -L --fail --retry 3 -o graphic-design/assets/jik-linkedin-headshots.jpg 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5edcbc89-f2cf-4ceb-b5ab-7e968849a96f'
          curl -L --fail --retry 3 -o graphic-design/assets/caliente-cinco-de-mayo.jpg 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:3f6f9a71-f9dd-4be1-9625-5ce965c9b5bf'
          curl -L --fail --retry 3 -o graphic-design/assets/jik-student-special.jpg 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:a388e63e-4e40-421f-82b9-2fda8b60b41b'
      - name: Commit assets and remove one-time importer
        shell: bash
        run: |
          rm -f .github/workflows/import-graphic-design-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graphic-design/assets .github/workflows/import-graphic-design-assets.yml
          git commit -m 'Add compressed graphic design portfolio assets'
          git push
