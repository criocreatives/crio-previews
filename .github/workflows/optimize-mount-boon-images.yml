name: Optimize Mount Boon preview images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-mount-boon-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize images
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mogrify -strip -interlace Plane -resize '1600x1600>' -quality 82 lot-18-mount-boon/assets/*.jpg
      - name: Commit optimized images and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/optimize-mount-boon-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lot-18-mount-boon/assets .github/workflows/optimize-mount-boon-images.yml
          git commit -m 'Optimize Lot 18 Mount Boon preview images'
          git pull --rebase origin main
          git push
