name: Import byLYNCH portfolio cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-bylynch-cover.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download cover image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portfolio/assets
          curl -L --fail --retry 3 -o portfolio/assets/bylynch-cover.jpg 'https://raw.githubusercontent.com/criocreatives/byLYNCH/main/assets/photos/bw-profile-close.jpg'
      - name: Commit cover and remove importer
        shell: bash
        run: |
          rm -f .github/workflows/import-bylynch-cover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portfolio/assets/bylynch-cover.jpg .github/workflows/import-bylynch-cover.yml
          git commit -m 'Add local byLYNCH portfolio cover'
          git pull --rebase origin main
          git push
