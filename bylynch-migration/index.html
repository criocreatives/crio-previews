<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>by LYNCH — Migration Preview</title>
<meta name="robots" content="noindex,nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap');
:root{--red:#ff1744;--ink:#111;--muted:#6f6f6f;--line:#e8e8e8;--max:1115px}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Lora,Georgia,serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.previewbar{background:#111;color:#fff;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.previewbar .wrap{padding:10px 0}
.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}
.sitehead{border-bottom:1px solid var(--line);background:#fff}
.navrow{min-height:76px;display:flex;align-items:center}
.logo{padding-right:14px;display:flex;align-items:center}
.logo img{width:164px;height:52px;object-fit:contain;background:#000}
.menu{display:flex;align-items:stretch;min-height:76px;border-left:1px solid var(--line);flex:1}
.menu a{display:flex;align-items:center;padding:0 14px;border-right:1px solid #f2f2f2;font-family:Lato,Arial,sans-serif;font-size:14px;font-weight:700;white-space:nowrap}
.menu a.active{color:var(--red)}
.searchbtn{margin-left:auto;width:53px;display:grid;place-items:center;border-left:1px solid var(--line);border-right:1px solid var(--line);font-size:25px;color:var(--red)}
.main{padding:62px 0 80px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:50px;row-gap:60px}
.cardmeta{display:flex;justify-content:space-between;gap:15px;margin-bottom:14px;font-family:Lato,Arial,sans-serif;font-size:12px;color:#5f5f5f;text-transform:uppercase}
.card{position:relative;display:block;width:100%;aspect-ratio:1/1.12;background:#222;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.card:hover img{transform:scale(1.015)}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0,rgba(0,0,0,.12) 56%,rgba(0,0,0,0) 78%)}
.cardcopy{position:absolute;left:26px;right:26px;bottom:25px;color:#fff}
.cardcopy h2{margin:0 0 20px;font-family:Lato,Arial,sans-serif;font-size:24px;line-height:1.05;font-weight:900;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cardcopy p{margin:0;font-family:Lora,Georgia,serif;font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cardcopy b{font-weight:800}
.pager{display:flex;justify-content:center;gap:10px;margin-top:58px}
.pager button{border:1px solid #ddd;background:#fff;padding:9px 12px;cursor:pointer}
.pager button.active{background:#111;color:#fff;border-color:#111}
.postwrap{max-width:920px;margin:auto}
.back{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.posthead{margin:25px 0 36px}
.posthead .eyebrow{font-size:12px;color:#666;text-transform:uppercase;margin-bottom:12px}
.posthead h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,7vw,76px);line-height:1.02;margin:0 0 14px;font-weight:400}
.posthead .date{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:.08em}
.postbody{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.65}
.postbody img{margin:28px auto;max-width:100%}
.wp-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:28px 0}
.wp-gallery figure{margin:0}.wp-gallery img{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;margin:0}
.embed{position:relative;padding-top:56.25%;margin:30px 0}.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.footer{border-top:1px solid var(--line);padding:34px 0 50px;color:#777;font-size:12px}
.status{padding:80px 0;text-align:center;color:#777}
@media(max-width:980px){
  .menu{overflow:auto}.menu a{padding:0 11px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 28px}
}
@media(max-width:680px){
  .wrap{width:calc(100% - 24px)}
  .navrow{display:block;padding:12px 0}
  .logo img{width:145px;height:46px}.menu{min-height:auto;margin-top:12px;border:0;overflow:auto}
  .menu a{padding:12px 10px;border:0;font-size:12px}.searchbtn{display:none}
  .main{padding-top:34px}.grid{grid-template-columns:1fr}.card{aspect-ratio:1/1.05}
}

/* OG Gazette single-post treatment */
.post-main-preview{padding:0 0 80px}.hero-preview{position:relative;background:#000;height:min(47vw,768px);min-height:440px;overflow:hidden}.hero-preview img{width:100%;height:100%;object-fit:cover}.hero-preview:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.75))}.hero-inner{position:absolute;z-index:2;left:50%;bottom:58px;transform:translateX(-50%);width:min(1260px,90%);color:#fff}.hero-inner .hero-cat{font-family:Lato,Arial,sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}.hero-inner h1{margin:0;max-width:930px;font-family:Lato,Arial,sans-serif;font-size:clamp(44px,5vw,72px);line-height:1.04;font-weight:900}.single-shell{width:min(930px,90%);margin:60px auto 0;display:grid;grid-template-columns:270px 600px;gap:60px;align-items:start}.meta-rail{font-family:Lato,Arial,sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;color:#777}.meta-rail span{display:block;border-top:1px solid #eee;padding:7px 0}.meta-rail span:last-child{border-bottom:1px solid #eee}.single-body{width:600px;max-width:100%;font-family:Lora,Georgia,serif;font-size:16px;line-height:1.65}.single-body p{margin:0 0 28px}.single-body figure,.single-body .wp-block-image{margin:0 0 30px}.single-body img{display:block;width:auto;max-width:100%;height:auto;margin:0 auto}.single-body blockquote{margin:30px 0;padding-left:24px;border-left:4px solid #eee;color:#555;font-style:italic}.single-body blockquote.has-text-align-right{text-align:right;padding-left:0;padding-right:24px;border-left:0;border-right:4px solid #eee}.single-body .wp-gallery,.single-body .wp-block-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:30px 0}.single-body .wp-gallery figure,.single-body .wp-block-gallery figure{margin:0}.single-body .wp-gallery img,.single-body .wp-block-gallery img{width:100%;height:100%;object-fit:cover}.single-comments{width:min(600px,90%);margin:60px calc((100% - 930px)/2) 0 auto;border-top:1px solid #ddd;padding-top:60px}.single-comments h2{font-size:24px}.menu-parent{position:relative;display:flex}.submenu{display:none;position:absolute;left:0;top:100%;min-width:210px;background:#fff;border:1px solid #ddd;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.08)}.submenu a{display:block!important;padding:12px 14px!important;border:0!important}.menu-parent:hover .submenu{display:block}
@media(max-width:760px){.hero-preview{height:62vw;min-height:300px}.hero-inner{bottom:28px}.hero-inner h1{font-size:42px}.single-shell{display:block;width:calc(100% - 28px);margin-top:36px}.meta-rail{margin-bottom:34px}.single-body{width:100%}.single-comments{width:calc(100% - 28px);margin:40px auto 0;padding-top:36px}.submenu{display:none!important}}

/* Mobile single-post fidelity to original Gazette theme */
@media(max-width:959px){
  .post-main-preview{padding:0 0 80px}
  .hero-preview{height:auto;min-height:0;background:#fff;overflow:visible}
  .hero-preview img{display:block;width:auto;max-width:100%;height:auto;margin:0 auto;background:#000}
  .hero-preview:after{display:none}
  .hero-inner{position:relative;left:auto;bottom:auto;transform:none;width:90%;margin:0 auto;color:#222;padding:30px 0 0}
  .hero-inner .hero-cat{font-family:Lato,Arial,sans-serif;font-size:13px;line-height:1.54;color:#e80832;text-transform:uppercase;margin:0 0 5px}
  .hero-inner h1{font-family:Lato,Arial,sans-serif;font-size:39px;line-height:1.54;font-weight:900;color:#222;margin:0}
  .single-shell{width:90%;margin:30px auto 0;display:flex;flex-direction:column;gap:0}
  .single-body{order:1;width:100%;max-width:none;font-family:Lora,Georgia,serif;font-size:16px;line-height:1.5}
  .single-body p{margin:0 0 30px}
  .single-body figure{margin:0 0 30px}
  .single-body img{display:block;width:auto;max-width:100%;height:auto;margin:0 auto}
  .single-body blockquote{color:#555;font-style:italic;margin:0 0 30px;padding:0;border:0}
  .meta-rail{order:2;width:100%;margin:0 0 30px;font-family:Lato,Arial,sans-serif;font-size:13px;line-height:1.54;text-transform:uppercase;color:#777}
  .meta-rail span{display:block;border-top:1px solid #eee;padding:5px 0}
  .meta-rail span:last-child{border-bottom:1px solid #eee}
  .single-comments{width:90%;margin:30px auto 0;padding-top:30px;border-top:1px solid #ddd}
  .single-comments h2{font-family:Lato,Arial,sans-serif;font-size:25px;line-height:1.2;font-weight:900;margin:0 0 30px}
}
@media(min-width:960px){
  .hero-preview{height:auto;min-height:440px;max-height:768px}
  .hero-preview img{width:100%;height:auto;min-height:440px;max-height:768px;object-fit:cover}
  .hero-inner{bottom:60px}
  .hero-inner h1{font-family:Lato,Arial,sans-serif;font-size:clamp(44px,5vw,72px);font-weight:900}
  .single-body{font-family:Lora,Georgia,serif}
}
</style>
</head>
<body>
<div class="previewbar"><div class="wrap">Migration Preview · Not Live</div></div>
<header class="sitehead">
  <div class="wrap navrow">
    <a class="logo" href="./"><img src="https://raw.githubusercontent.com/criocreatives/byLYNCH/main/assets/LYNCH%20Logo%20Family/LYNCH%20Logo%20brick%20solid.svg" alt="LYNCH"></a>
    <nav class="menu">
      <a class="active" href="./">Home</a>
      <a href="https://gumroad.com/seenbylynch" target="_blank" rel="noopener">Store</a>
      <a href="?cat=FILM">Film</a>
      <div class="menu-parent"><a href="?cat=CULTURE">Culture &amp; Arts</a><div class="submenu"><a href="?tag=music">MUSIC</a><a href="?cat=ARTS">ARTS</a><a href="?cat=NEW%20WAVE">NEW WAVE</a></div></div>
      <a href="https://www.flickr.com/photos/lebosslynch/albums" target="_blank" rel="noopener">Photography</a>
      <div class="menu-parent"><a href="?tag=series">Series</a><div class="submenu"><a href="?cat=KNIGHT%20LOVE%20L%E2%80%99S">KNIGHT LOVE L’S</a><a href="?cat=PHOTO%20SET">PHOTO SETS</a><a href="?cat=PIXTAPE">PIXTAPE</a></div></div>
      <a href="https://www.instagram.com/lebosslynch/" target="_blank" rel="noopener">Instagram</a>
      <a href="?page=about">about LYNCH</a>
    </nav>
    <div class="searchbtn">⌕</div>
  </div>
</header>
<main class="wrap main" id="app"><div class="status">Loading migration preview…</div></main>
<footer class="footer"><div class="wrap">by LYNCH · WordPress → GitHub migration preview</div></footer>
<script>
const RAW='https://raw.githubusercontent.com/criocreatives/byLYNCH/wordpress-migration/';
const app=document.getElementById('app');
const qp=new URLSearchParams(location.search);
const perPage=12;
const FEATURED={"another-not-lit-christmas-eve":"2016/12/img_4713.jpg","mcavelle":"2016/12/mcavellc3a9.jpg","hotel-in-kingston":"2016/12/img_3125.jpg","dont-need":"2017/01/img_9773.jpg","the-disease":"2017/01/img_2563.jpg","anchor-studio-with-runkus":"2017/01/img_8977.jpg","omelette":"2017/01/img_9859.jpg","alpine-compound":"2017/01/img_0095.jpg","jada-the-iphone":"2017/01/mg_3845.jpg","raj-the-pretty-dress":"2017/01/img_5676.jpg","boaty-ft-pedro-deniro":"2017/01/img_5606.png","riviere-flechir":"2017/01/img_6001.jpg","god-ting":"2017/01/img_9088.jpg","sherlock-shenanigans":"2017/01/img_6264.jpg","saturday-night-blues-w-yanah-kone":"2017/01/img_6689.jpg","h-e-a-l-i-n-g-in-tivoli-gardens":"2017/01/img_4489.jpg","jungle-flex-w-hiidden-fvces":"2017/02/img_7403.jpg","yada":"2017/02/img_4682-2.jpg","new-wave-february-6-2017":"2017/02/img_8264-2.jpg","belisario-the-soundboy-by-leasho-johnson":"2017/02/mg_8573.jpg","compound-live":"2017/03/mg_7279.jpg","hail-who-hail-you":"2017/04/img_9942.jpg","tsajmelle":"2017/04/mg_8769-e1493052866531.jpg","naked-lady":"2017/05/mg_0792-1.jpg","light-skin-stop-wear":"2017/07/mg_4445.jpg","the-roze-the-rimz":"2017/07/mg_3918-1.jpg","unsicher":"2017/09/img_2810.jpg","sblv1":"2017/10/sblv1-promo2.jpg","red-october":"2017/10/mg_8782.jpg","tuyo":"2017/10/screenshot-31-e1509166962562.png","codeine-crazy":"2017/11/mg_9153.jpg","dubwise-ft-chronixx-friends":"2017/11/mg_0687.jpg","chocolate":"2017/11/mg_1010.jpg","my-gf":"2017/12/mg_2768.jpg","havana":"2018/01/mg_8518.jpg","phone-secks":"2018/03/mg_4530.jpg","russian-rickolette":"2018/03/mg_5378.jpg","no-rest-for-the-wicked-ft-jada-kingdom":"2018/06/mg_9431.jpg","something-like-a-dream":"2018/09/mg_7929.jpg","kingdom":"2018/09/mg_9407-2.jpg","lust":"2018/11/mg_8657-no-kltat.jpg","chloe-ana":"2019/02/mg_0359.jpg","kesi-g":"2019/03/mg_2598.jpg","ricki-ticki":"2019/03/mg_3409.jpg","purplereign":"2020/01/mg_8263.jpg","fabricki":"2020/01/mg_8295.jpg","black-gold":"2020/01/mg_1483-2.jpg","mcavelle-returns":"2020/02/mg_1894.jpg","falling-edge":"2021/02/share-24fb74e0-94c3-4bb7-b441-737eb082a940.jpg","bk":"2022/08/mg_9156.jpg","swove-in-ledish":"2024/09/img_7884.jpg","kraka":"2024/09/img_6780.jpg"};

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function fmtDate(s){const d=new Date(s.replace(' ','T')+'-05:00');return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});}
function rewriteMedia(html){
  return html
    .replaceAll('src="/assets/uploads/','src="'+RAW+'assets/uploads/')
    .replaceAll('href="/assets/uploads/','href="'+RAW+'assets/uploads/');
}
function splitPost(md){
  const parts=md.split(/^---\s*$/m);
  return parts.length>=3?{front:parts[1],body:parts.slice(2).join('---')}:{body:md};
}
function firstImg(body){
  const m=body.match(/<img[^>]+src=["']([^"']+)["']/i);
  if(!m) return '';
  let src=m[1];
  if(src.startsWith('/assets/uploads/')) src=RAW+'assets/uploads/'+src.slice('/assets/uploads/'.length);
  return src;
}
function cardImg(p,body){
  if(FEATURED[p.slug]) return RAW+'assets/uploads/'+FEATURED[p.slug];
  return firstImg(body);
}
function stripText(body){
  return body
    .replace(/\[(gallery|caption|youtube|soundcloud)[^\]]*\]/gi,' ')
    .replace(/<[^>]*>/g,' ')
    .replace(/&nbsp;/gi,' ')
    .replace(/&amp;/gi,'&')
    .replace(/&#8217;/g,"'")
    .replace(/\s+/g,' ')
    .trim();
}
async function loadManifest(){
  const r=await fetch(RAW+'migration-manifest.json',{cache:'no-store'});
  if(!r.ok) throw new Error('Could not load migration manifest.');
  return r.json();
}
async function loadPostSource(p){
  const date=p.date.slice(0,10);
  const r=await fetch(RAW+`_posts/${date}-${p.slug}.md`,{cache:'no-store'});
  if(!r.ok) return {body:''};
  return splitPost(await r.text());
}
async function showIndex(){
  let items=await loadManifest();
  const cat=qp.get('cat');
  if(cat) items=items.filter(x=>(x.categories||[]).some(c=>c.toUpperCase()===cat.toUpperCase()));
  items.sort((a,b)=>b.date.localeCompare(a.date));
  const page=Math.max(1,parseInt(qp.get('p')||'1',10));
  const start=(page-1)*perPage;
  const slice=items.slice(start,start+perPage);
  const enriched=await Promise.all(slice.map(async p=>({p,src:await loadPostSource(p)})));
  app.innerHTML=`<div class="grid">${enriched.map(({p,src})=>{
    const img=cardImg(p,src.body);
    const excerpt=stripText(src.body).slice(0,95);
    const comments=p.comments?(`${p.comments} comment${p.comments===1?'':'s'}`):'Leave a comment';
    return `<article>
      <div class="cardmeta"><span>${esc((p.categories||[]).join(', '))}</span><span>${comments}</span></div>
      <a class="card" href="?post=${encodeURIComponent(p.slug)}">
        ${img?`<img src="${img}" alt="">`:'<div style="position:absolute;inset:0;background:#222"></div>'}
        <div class="shade"></div>
        <div class="cardcopy"><h2>${esc(p.title)}</h2><p>${esc(excerpt)}${excerpt?'… ':''}<b>Continue reading</b></p></div>
      </a>
    </article>`;
  }).join('')}</div>
  <div class="pager">${Array.from({length:Math.ceil(items.length/perPage)},(_,i)=>i+1).map(n=>`<button class="${n===page?'active':''}" onclick="location.href='?p=${n}${cat?'&cat='+encodeURIComponent(cat):''}'">${n}</button>`).join('')}</div>`;
}
function frontValue(front,key){
  const line=(front||'').split('\n').find(x=>x.startsWith(key+':'));
  if(!line)return '';
  return line.slice(key.length+1).trim().replace(/^["']|["']$/g,'');
}
function frontList(front,key){
  const lines=(front||'').split('\n');
  const i=lines.findIndex(x=>x.trim()===key+':');
  if(i<0)return[];
  const out=[];
  for(let n=i+1;n<lines.length;n++){
    const line=lines[n];
    if(!/^\s+-\s+/.test(line))break;
    out.push(line.replace(/^\s+-\s+/,'').replace(/^["']|["']$/g,'').trim());
  }
  return out;
}
async function showPost(slug){
  const items=await loadManifest();
  const p=items.find(x=>x.slug===slug);
  if(!p) throw new Error('Post not found.');
  const src=await loadPostSource(p);
  const tags=frontList(src.front||'','tags');
  const author=frontValue(src.front||'','author')||'lebosslynch';
  const modified=frontValue(src.front||'','modified');
  const hero=FEATURED[slug]?RAW+'assets/uploads/'+FEATURED[slug]:firstImg(src.body);
  document.title=p.title+' — by LYNCH Preview';
  app.className='post-main-preview';
  app.innerHTML=`<header class="hero-preview">${hero?`<img src="${hero}" alt="">`:''}<div class="hero-inner"><div class="hero-cat">${esc((p.categories||[]).join(' · '))}</div><h1>${esc(p.title)}</h1></div></header>
  <div class="single-shell"><article class="single-body">${rewriteMedia(src.body)}</article><aside class="meta-rail"><span>${fmtDate(p.date)}</span>${modified?`<span>${fmtDate(modified.split(' ')[0]+' 00:00:00')}</span>`:''}<span>${esc(author)}</span>${tags.length?`<span>${esc(tags.join(', '))}</span>`:''}</aside></div>
  ${p.comments?`<section class="single-comments"><h2>${p.comments} Comment${p.comments===1?'':'s'}</h2><p style="color:#777">Archived WordPress comments are preserved in the migrated post source.</p></section>`:''}`;
}
async function showPage(name){
  const path=name==='about'?'about/index.html':'contact/index.html';
  const r=await fetch(RAW+path,{cache:'no-store'});
  if(!r.ok) throw new Error('Could not load page.');
  const src=splitPost(await r.text());
  const title=name==='about'?'about LYNCH':'CONTACT';
  app.innerHTML=`<div class="postwrap"><a class="back" href="./">← Back to journal</a><header class="posthead"><h1>${title}</h1></header><div class="postbody">${rewriteMedia(src.body)}</div></div>`;
}
(async()=>{
 try{
  if(qp.get('post')) await showPost(qp.get('post'));
  else if(qp.get('page')) await showPage(qp.get('page'));
  else {app.className='wrap main'; await showIndex();}
 }catch(e){app.innerHTML='<div class="status"><strong>Preview error:</strong> '+esc(e.message)+'</div>';}
})();
</script>
</body>
</html>
