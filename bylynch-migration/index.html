const FEATURED={"another-not-lit-christmas-eve":"2016/12/img_4713.jpg","mcavelle":"2016/12/mcavellc3a9.jpg","hotel-in-kingston":"2016/12/img_3125.jpg","dont-need":"2017/01/img_9773.jpg","the-disease":"2017/01/img_2563.jpg","anchor-studio-with-runkus":"2017/01/img_8977.jpg","omelette":"2017/01/img_9859.jpg","alpine-compound":"2017/01/img_0095.jpg","jada-the-iphone":"2017/01/mg_3845.jpg","raj-the-pretty-dress":"2017/01/img_5676.jpg","boaty-ft-pedro-deniro":"2017/01/img_5606.png","riviere-flechir":"2017/01/img_6001.jpg","god-ting":"2017/01/img_9088.jpg","sherlock-shenanigans":"2017/01/img_6264.jpg","saturday-night-blues-w-yanah-kone":"2017/01/img_6689.jpg","h-e-a-l-i-n-g-in-tivoli-gardens":"2017/01/img_4489.jpg","jungle-flex-w-hiidden-fvces":"2017/02/img_7403.jpg","yada":"2017/02/img_4682-2.jpg","new-wave-february-6-2017":"2017/02/img_8264-2.jpg","belisario-the-soundboy-by-leasho-johnson":"2017/02/mg_8573.jpg","compound-live":"2017/03/mg_7279.jpg","hail-who-hail-you":"2017/04/img_9942.jpg","tsajmelle":"2017/04/mg_8769-e1493052866531.jpg","naked-lady":"2017/05/mg_0792-1.jpg","light-skin-stop-wear":"2017/07/mg_4445.jpg","the-roze-the-rimz":"2017/07/mg_3918-1.jpg","unsicher":"2017/09/img_2810.jpg","sblv1":"2017/10/sblv1-promo2.jpg","red-october":"2017/10/mg_8782.jpg","tuyo":"2017/10/screenshot-31-e1509166962562.png","codeine-crazy":"2017/11/mg_9153.jpg","dubwise-ft-chronixx-friends":"2017/11/mg_0687.jpg","chocolate":"2017/11/mg_1010.jpg","my-gf":"2017/12/mg_2768.jpg","havana":"2018/01/mg_8518.jpg","phone-secks":"2018/03/mg_4530.jpg","russian-rickolette":"2018/03/mg_5378.jpg","no-rest-for-the-wicked-ft-jada-kingdom":"2018/06/mg_9431.jpg","something-like-a-dream":"2018/09/mg_7929.jpg","kingdom":"2018/09/mg_9407-2.jpg","lust":"2018/11/mg_8657-no-kltat.jpg","chloe-ana":"2019/02/mg_0359.jpg","kesi-g":"2019/03/mg_2598.jpg","ricki-ticki":"2019/03/mg_3409.jpg","purplereign":"2020/01/mg_8263.jpg","fabricki":"2020/01/mg_8295.jpg","black-gold":"2020/01/mg_1483-2.jpg","mcavelle-returns":"2020/02/mg_1894.jpg","falling-edge":"2021/02/share-24fb74e0-94c3-4bb7-b441-737eb082a940.jpg","bk":"2022/08/mg_9156.jpg","swove-in-ledish":"2024/09/img_7884.jpg","kraka":"2024/09/img_6780.jpg"};
const app=document.getElementById('app'),qp=new URLSearchParams(location.search),perPage=12;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function fmtDate(s){const d=new Date(s.replace(' ','T')+'-05:00');return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});}
function splitPost(md){const parts=md.split(/^---\s*$/m);return parts.length>=3?{front:parts[1],body:parts.slice(2).join('---')}:{front:'',body:md};}
function frontValue(front,key){const line=(front||'').split('\n').find(x=>x.startsWith(key+':'));if(!line)return '';return line.slice(key.length+1).trim().replace(/^["']|["']$/g,'');}
function frontList(front,key){const lines=(front||'').split('\n'),i=lines.findIndex(x=>x.trim()===key+':');if(i<0)return[];const out=[];for(let n=i+1;n<lines.length;n++){if(!/^\s+-\s+/.test(lines[n]))break;out.push(lines[n].replace(/^\s+-\s+/,'').replace(/^["']|["']$/g,'').trim());}return out;}
function archivedComments(front){
  const lines=(front||'').split('\n'),start=lines.findIndex(x=>x.trim()==='archived_comments:');
  if(start<0)return[];
  const out=[];let cur=null;
  for(let i=start+1;i<lines.length;i++){
    const line=lines[i];
    if(/^\S/.test(line))break;
    let m=line.match(/^\s{2}- author:\s*["']?(.*?)["']?\s*$/);
    if(m){if(cur)out.push(cur);cur={author:m[1],date:'',content:''};continue;}
    m=line.match(/^\s{4}date:\s*["']?(.*?)["']?\s*$/);if(m&&cur){cur.date=m[1];continue;}
    m=line.match(/^\s{4}content:\s*["']?(.*?)["']?\s*$/);if(m&&cur){cur.content=m[1].replace(/\\n/g,' ').replace(/<[^>]+>/g,' ').trim();continue;}
  }
  if(cur)out.push(cur);return out;
}
function rewriteMedia(html){return html.replaceAll('src="/assets/uploads/','src="'+RAW+'assets/uploads/').replaceAll('href="/assets/uploads/','href="'+RAW+'assets/uploads/');}
function firstImg(body){const m=body.match(/<img[^>]+src=["']([^"']+)["']/i);if(!m)return '';let src=m[1];if(src.startsWith('/assets/uploads/'))src=RAW+'assets/uploads/'+src.slice('/assets/uploads/'.length);return src;}
function cleanText(body){return body.replace(/<!--[sS]*?-->/g,' ').replace(/<figure[sS]*?<\/figure>/gi,' ').replace(/<img[^>]*>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&#8217;/g,"’").replace(/&#8220;|&#8221;/g,'"').replace(/\s+/g,' ').trim();}
function cardExcerpt(src){const explicit=frontValue(src.front||'','excerpt');if(explicit)return explicit;return cleanText(src.body);}
function truncateWords(text,n=55){const w=(text||'').split(/\s+/).filter(Boolean);return {text:w.slice(0,n).join(' '),cut:w.length>n};}
async function loadManifest(){const r=await fetch(RAW+'migration-manifest.json',{cache:'no-store'});if(!r.ok)throw new Error('Could not load migration manifest.');return r.json();}
async function loadPostSource(p){const r=await fetch(RAW+'_posts/'+p.date.slice(0,10)+'-'+p.slug+'.md',{cache:'no-store'});if(!r.ok)return{front:'',body:''};return splitPost(await r.text());}
function styleCards(){document.querySelectorAll('.blog .hentry.format-gallery.has-post-thumbnail').forEach(card=>{const meta=card.querySelector('.entry-meta'),thumb=card.querySelector('.post-thumbnail');if(!thumb)return;const top=(meta?meta.offsetHeight:0)+15;thumb.style.top=top+'px';thumb.style.height=Math.max(0,card.offsetHeight-top)+'px';if(meta){const a=meta.querySelector('.cat-links'),b=meta.querySelector('.comments-link');card.classList.toggle('long-meta',!!(a&&b&&a.offsetWidth+b.offsetWidth>=meta.offsetWidth));}});}
function cleanImageLists(root=document){root.querySelectorAll('.entry-content li').forEach(li=>{if(li.querySelector('img')){li.classList.add('image-item');if(li.parentElement)li.parentElement.classList.add('image-list');}});}
function bkColumnCount(){const w=window.innerWidth;if(w>=900)return 3;if(w>=600)return 2;return 1;}
function layoutBkMasonry(){
  const grid=document.querySelector('.bk-redesign .entry-content');
  if(!grid)return;
  const gap=10,cols=bkColumnCount(),items=[...grid.children].filter(el=>getComputedStyle(el).display!=='none');
  const total=grid.clientWidth,colWidth=(total-gap*(cols-1))/cols,heights=new Array(cols).fill(0);
  items.forEach((item,i)=>{
    const col=i%cols;
    item.style.position='absolute';
    item.style.width=colWidth+'px';
    item.style.left=(col*(colWidth+gap))+'px';
    item.style.top=heights[col]+'px';
    item.style.gridColumn='';
    item.style.gridRow='';
    const h=item.getBoundingClientRect().height;
    heights[col]+=h+gap;
  });
  grid.style.height=(Math.max(0,...heights)-gap)+'px';
}
function initBkMasonry(){
  const grid=document.querySelector('.bk-redesign .entry-content');
  if(!grid)return;
  grid.querySelectorAll('img').forEach(img=>{if(!img.complete)img.addEventListener('load',layoutBkMasonry);});
  requestAnimationFrame(()=>requestAnimationFrame(layoutBkMasonry));
}
async function showIndex(){
  document.body.className='blog';
  let items=await loadManifest();const cat=qp.get('cat');if(cat)items=items.filter(x=>(x.categories||[]).some(c=>c.toUpperCase()===cat.toUpperCase()));items.sort((a,b)=>b.date.localeCompare(a.date));
  const page=Math.max(1,parseInt(qp.get('p')||'1',10)),slice=items.slice((page-1)*perPage,page*perPage);
  const enriched=await Promise.all(slice.map(async p=>({p,src:await loadPostSource(p)})));
  app.innerHTML='<div class="site-content-inner"><div class="content-area"><main class="site-main">'+enriched.map(({p,src})=>{
    const img=FEATURED[p.slug]?RAW+'assets/uploads/'+FEATURED[p.slug]:firstImg(src.body),ex=truncateWords(cardExcerpt(src),55),comments=p.comments?(`${p.comments} Comment${p.comments===1?'':'s'}`):'Leave a comment';
    return `<article class="hentry format-gallery has-post-thumbnail"><header class="entry-header"><div class="entry-meta"><span class="cat-links">${esc((p.categories||[]).join(', '))}</span><span class="comments-link">${comments}</span></div><a class="post-thumbnail" href="?post=${encodeURIComponent(p.slug)}" style="${img?'background-image:url(&quot;'+img+'&quot;)':''}"></a><h1 class="entry-title"><a href="?post=${encodeURIComponent(p.slug)}">${esc(p.title)}</a></h1></header><div class="entry-summary"><p>${esc(ex.text)}${ex.cut?'… ':ex.text?' ':''}<a class="more-link" href="?post=${encodeURIComponent(p.slug)}">Continue reading</a></p></div></article>`;
  }).join('')+'</main><div class="pager">'+Array.from({length:Math.ceil(items.length/perPage)},(_,i)=>i+1).map(n=>`<button class="${n===page?'active':''}" onclick="location.href='?p=${n}${cat?'&cat='+encodeURIComponent(cat):''}'">${n}</button>`).join('')+'</div></div></div>';
  requestAnimationFrame(styleCards);setTimeout(styleCards,250);
}
async function showPost(slug){
  document.body.className='single';const items=await loadManifest(),p=items.find(x=>x.slug===slug);if(!p)throw new Error('Post not found.');const src=await loadPostSource(p),tags=frontList(src.front||'','tags'),author=frontValue(src.front||'','author')||'lebosslynch',modified=frontValue(src.front||'','modified'),hero=FEATURED[slug]?RAW+'assets/uploads/'+FEATURED[slug]:firstImg(src.body);
  document.title=p.title+' — by LYNCH Preview';
  const isBk=slug==='bk'||slug==='falling-edge',comments=archivedComments(src.front||'');
  const meta=isBk?`<div class="bk-post-meta"><div class="bk-post-meta-inner"><div class="bk-post-date">${fmtDate(p.date)}</div>${tags.length?`<div class="bk-post-tags"><em>${esc(tags.join(', '))}</em></div>`:''}</div></div>`:'';
  const footer=isBk?'':`<footer class="entry-footer"><span>${fmtDate(p.date)}</span>${modified?'<span>'+fmtDate(modified.split(' ')[0]+' 00:00:00')+'</span>':''}<span>${esc(author)}</span>${tags.length?'<span>'+esc(tags.join(', '))+'</span>':''}</footer>`;
  const commentsHtml=comments.length?`<section class="comments-area"><h2>${comments.length} thought${comments.length===1?'':'s'} on “${esc(p.title)}”</h2>${comments.map(c=>`<article class="comment"><div class="comment-author">${esc(c.author)} says:</div>${c.date?`<div class="comment-date">${esc(c.date)}</div>`:''}<div class="comment-body">${esc(c.content)}</div></article>`).join('')}</section>`:(p.comments?`<section class="comments-area"><h2>${p.comments} thought${p.comments===1?'':'s'} on “${esc(p.title)}”</h2></section>`:'');
  app.innerHTML=`<header class="entry-header entry-hero"><div class="post-thumbnail">${hero?'<img data-featured-image src="'+hero+'" alt="">':'<img data-featured-image alt="">'}</div><div class="entry-header-wrapper"><div class="entry-header-inner"><div class="entry-meta">${esc((p.categories||[]).join(', '))}</div><h1 class="entry-title">${esc(p.title)}</h1></div></div></header>${meta}<div class="site-content-inner${isBk?' bk-redesign':''}"><div class="content-area"><main class="site-main"><article class="hentry single-entry"><div class="entry-content">${rewriteMedia(src.body)}</div>${footer}</article>${commentsHtml}</main></div></div>`;
  const hi=document.querySelector('[data-featured-image]');if(hi){hi.onerror=()=>{const first=document.querySelector('.entry-content img');if(first&&hi.src!==first.src)hi.src=first.src;};if(!hi.getAttribute('src')){const first=document.querySelector('.entry-content img');if(first)hi.src=first.src;}}
  cleanImageLists(app);
  if(isBk)initBkMasonry();
}
async function showPage(name){document.body.className='';const path=name==='about'?'about/index.html':'contact/index.html',r=await fetch(RAW+path,{cache:'no-store'});if(!r.ok)throw new Error('Could not load page.');const src=splitPost(await r.text()),title=name==='about'?'about LYNCH':'CONTACT';app.innerHTML='<div class="site-content-inner"><div class="content-area"><main class="site-main"><article class="hentry"><h1>'+title+'</h1><div class="entry-content">'+rewriteMedia(src.body)+'</div></article></main></div></div>';cleanImageLists(app);}
const nav=document.getElementById('site-navigation'),toggle=nav.querySelector('.menu-toggle');toggle.addEventListener('click',()=>{const on=nav.classList.toggle('toggled');toggle.setAttribute('aria-expanded',on?'true':'false');});
document.querySelectorAll('.menu-item-has-children').forEach(li=>{const b=document.createElement('button');b.className='dropdown-toggle';b.type='button';b.setAttribute('aria-expanded','false');li.appendChild(b);b.addEventListener('click',e=>{e.preventDefault();const sub=li.querySelector('.sub-menu');if(!sub)return;const on=sub.classList.toggle('toggled');b.classList.toggle('toggled',on);b.setAttribute('aria-expanded',on?'true':'false');});});
window.addEventListener('resize',()=>{clearTimeout(window.__r);window.__r=setTimeout(()=>{styleCards();layoutBkMasonry();},120);});
(async()=>{try{if(qp.get('post'))await showPost(qp.get('post'));else if(qp.get('page'))await showPage(qp.get('page'));else await showIndex();}catch(e){app.innerHTML='<div class="status"><strong>Preview error:</strong> '+esc(e.message)+'</div>';}})();
</script>
